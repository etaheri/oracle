<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OUTSEEN</title><link rel="stylesheet" href="/style.css">
<meta name="robots" content="noindex">
</head><body>
<main>
  <h1>OUTSEEN</h1>
  <p>Five questions about tomorrow. Choose your answer and how sure you are. Return to see whether you beat the Oracle.</p>
  <p id="open"><a href="oracle://round">Open in the app</a></p>
  <p id="store"><a id="storeLink" href="/">About OUTSEEN</a></p>
</main>
<script>
  // Both links show immediately — no scripted navigation. A `location.href`
  // assignment to a custom scheme fires on every visitor including those
  // without the app installed, which throws an OS-level "can't open this
  // page" alert in front of them; only a user gesture (the anchor above)
  // should attempt the scheme. APP_STORE_URL is empty until the listing is
  // live, so until then the fallback is a truthful link to the site, not a
  // store promise the app can't keep.
  var APP_STORE_URL = "";
  if (APP_STORE_URL) {
    var link = document.getElementById("storeLink");
    link.href = APP_STORE_URL;
    link.textContent = "Get OUTSEEN on the App Store";
  }
</script>
</body></html>
